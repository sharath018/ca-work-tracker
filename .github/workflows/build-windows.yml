name: Build Windows Executable & Installer

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on semantic version tags: v1.0.0, v1.0.1, etc.

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      shell: cmd
    
    - name: Build executable with PyInstaller
      run: |
        cd build_scripts
        build.bat
      shell: cmd
    
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
      shell: cmd
    
    - name: Create installer with Inno Setup
      run: |
        $version = "${{ github.ref_name }}".TrimStart("v")
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\CA_Work_Tracker.iss
      shell: powershell
    
    - name: Verify installer was created
      run: |
        if exist "installer\output\CA_Work_Tracker_Installer.exe" (
          echo Installer created successfully
          dir installer\output\CA_Work_Tracker_Installer.exe
        ) else (
          echo ERROR: Installer not found
          exit 1
        )
      shell: cmd
    
    - name: Get release notes from CHANGELOG
      id: changelog
      run: |
        # Extract version from tag (v1.0.0 -> 1.0.0)
        $version = "${{ github.ref }}".Replace("refs/tags/v", "")
        echo "version=$version" >> $env:GITHUB_OUTPUT
        
        # Read CHANGELOG and extract section for this version
        $changelog = Get-Content CHANGELOG.md -Raw
        if ($changelog -match "## \[$version\](.+?)(?=## \[|\z)") {
          $notes = $matches[1].Trim()
          # Escape for GitHub Actions
          $notes = $notes -replace "`n", "%0A"
          echo "notes=$notes" >> $env:GITHUB_OUTPUT
        } else {
          echo "notes=See CHANGELOG.md for release notes" >> $env:GITHUB_OUTPUT
        }
      shell: powershell
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: CA Work Tracker ${{ steps.changelog.outputs.version }}
        body: ${{ steps.changelog.outputs.notes }}
        files: installer/output/CA_Work_Tracker_Installer.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build summary
      run: |
        echo.
        echo ============================================
        echo BUILD SUCCESSFUL!
        echo ============================================
        echo.
        echo Version: ${{ steps.changelog.outputs.version }}
        echo Installer: CA_Work_Tracker_Installer.exe
        echo Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        echo.
        echo Release will be available shortly at:
        echo https://github.com/${{ github.repository }}/releases/latest
        echo.
      shell: cmd
